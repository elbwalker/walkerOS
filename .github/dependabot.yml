version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "docker"
    directories:
      - "/packages/cli"
      - "/packages/runner"
      - "/apps/demos/flows"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
