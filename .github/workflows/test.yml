name: Build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_test:
    name: Build and test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: 'npm'
      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            packages/**/node_modules
            apps/*/node_modules
          key: nm-${{ runner.os }}-node24.15.0-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci
      # Turbo's local cache, carried between runs by GitHub's cache (replaces the
      # Vercel remote cache). Each run saves under its own SHA and restores the
      # newest prior entry, so PR runs start warm from main. Restore and save are
      # separate steps so a failed or cancelled run still saves what it built.
      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # Drift gate: the committed CLI api.gen.d.ts (and spec.json) must equal a
      # fresh, prettier-formatted generate:types run. Prevents stale/unformatted
      # generated API types from being committed (the recurring eternal-diff).
      - name: Verify CLI API types are in sync
        run: |
          npm --prefix packages/cli run generate:types
          git diff --exit-code packages/cli/openapi/spec.json packages/cli/src/types/api.gen.d.ts \
          || (echo "::error ::CLI generated API types are stale. Run 'cd packages/cli && npm run generate:types' and commit the result." && exit 1)
      # The contract label's floor never goes backwards against the base: the
      # target branch on a pull request, the previous tip on a push. Skipped
      # without a base (a dispatch, a new branch) or when the base has no
      # client spec.
      - name: Verify the contract label floor
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/${BASE_REF}"
          else
            BASE="${BEFORE}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit; contract label check skipped."
            exit 0
          fi
          if ! git show "$BASE:packages/cli/openapi/spec.json" > "$RUNNER_TEMP/base-spec.json" 2>/dev/null; then
            echo "No packages/cli/openapi/spec.json at $BASE; contract label check skipped."
            exit 0
          fi
          node packages/cli/scripts/check-client-contract.mjs --label-base "$RUNNER_TEMP/base-spec.json"
      - name: Validate documentation
        run: npm run validate:links
      - name: Verify (PR, affected only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          npx turbo run typecheck lint test test:integration --affected
      - name: Verify (push to main or manual, full)
        if: github.event_name != 'pull_request'
        run: npx turbo run typecheck lint test test:integration
      - name: Run e2e tests
        if: github.event_name != 'pull_request'
        run: npm run test:e2e
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.run_id }}
          path: |
            packages/*/coverage/
            packages/*/.tmp/
          retention-days: 7
      - name: Save turbo cache
        if: always() && steps.turbo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
